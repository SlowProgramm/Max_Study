<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script src="/static/max-auth.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <title>Мои тесты</title>
  <style>
    body { max-width: 720px; margin: 0 auto; padding: 16px 14px 48px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button {
      flex: 1; background: #e5e7eb; color: #111; padding: 10px;
    }
    .tabs button.active { background: #4c8bf5; color: #fff; }
    .item {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 14px; margin-bottom: 10px; cursor: pointer;
    }
    .item:hover { border-color: #93c5fd; }
    .item h3 { margin: 0 0 6px; font-size: 16px; }
    .item .meta { color: #6b7280; font-size: 13px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px;
      vertical-align: middle;
    }
    .badge.draft { background: #fef3c7; color: #92400e; }
    .badge.live { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <button class="back" onclick="location.href='/teacher_page'">← В меню учителя</button>
  <h1>Мои тесты</h1>
  <p class="subtitle">Черновики (запланированные) и опубликованные — откройте карточку для QR и уведомления.</p>

  <div class="tabs">
    <button type="button" class="active" id="tabDraft" onclick="setTab('draft')">Запланированные</button>
    <button type="button" id="tabLive" onclick="setTab('live')">Опубликованные</button>
  </div>
  <div id="list"><p class="muted">Загрузка...</p></div>

<script>
let _all = [];
let _tab = "draft";

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function fmtTime(sec) {
  if (!sec) return "без ограничения";
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m && s) return m + " мин " + s + " сек";
  if (m) return m + " мин";
  return s + " сек";
}

function setTab(tab) {
  _tab = tab;
  document.getElementById("tabDraft").classList.toggle("active", tab === "draft");
  document.getElementById("tabLive").classList.toggle("active", tab === "live");
  render();
}

function render() {
  const box = document.getElementById("list");
  const items = _all.filter(t => _tab === "draft" ? t.is_draft : !t.is_draft);
  if (!items.length) {
    box.innerHTML = _tab === "draft"
      ? '<p class="muted">Нет запланированных. Сохраните тест как черновик при создании.</p>'
      : '<p class="muted">Нет опубликованных тестов.</p>';
    return;
  }
  box.innerHTML = items.map(d => `
    <div class="item" onclick="location.href='/teacher_test?id=${d.test_id}'">
      <h3>
        ${escapeHtml(d.title)}
        <span class="badge ${d.is_draft ? "draft" : "live"}">${d.is_draft ? "черновик" : "опубликован"}</span>
      </h3>
      <div class="meta">
        ${d.created_at ? escapeHtml(d.created_at) + " · " : ""}
        код ${escapeHtml(d.access_code)} · ⏱ ${fmtTime(d.time_limit_seconds)}
      </div>
    </div>
  `).join("");
}

async function load() {
  const box = document.getElementById("list");
  try {
    const res = await maxFetch("/api/teacher/my-tests");
    if (!res.ok) throw new Error(maxErrorText(res.status, await res.json().catch(() => ({}))));
    _all = await res.json();
    render();
  } catch (e) {
    box.innerHTML = `<p class="muted" style="color:#dc2626">${escapeHtml(e.message)}</p>`;
  }
}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/static/max-auth.js"></script>
    <link rel="stylesheet" href="/static/style.css">

    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>MAX Study</title>


    <style>
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 14px 48px;
        }
        h1 { font-size: 22px; margin: 0 0 16px; }
        h2 { font-size: 18px; margin: 16px 0 10px; }
        h3 { font-size: 15px; margin: 0 0 8px; }
        h4 { font-size: 14px; margin: 12px 0 8px; color: #374151; }

        .form-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .form-card label { margin-top: 0; }
        .form-card input[type="text"],
        .form-card input[type="number"] {
            width: 100%;
            margin: 0 0 12px;
        }
        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .form-actions button { flex: 1; min-width: 140px; }

        /* loader */
        .loading-box {
            display: none;
            text-align: center;
            padding: 28px 16px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            margin: 16px 0;
        }
        .loading-box.show { display: block; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-box p { margin: 0; color: #1e40af; font-size: 15px; }

        .question {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .q-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .q-head h3 { margin: 0; }
        .q-head .delete {
            background: #fee2e2;
            color: #b91c1c;
            padding: 6px 10px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .question input[type="text"],
        .question textarea {
            width: 100%;
            margin: 0 0 8px;
        }

        /* answers */
        .answer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fafafa;
        }
        .answer.selected-answer {
            background: #ecfdf5;
            border-color: #6ee7b7;
        }
        .answer input[type="text"] {
            flex: 1;
            min-width: 0;
            margin: 0;
            width: auto;
        }
        .answer .delete {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 10px;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* correct toggle */
        .correct-toggle {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            font-size: 13px;
            color: #6b7280;
            padding: 4px 0;
        }
        .correct-toggle input {
            width: 20px;
            height: 20px;
            margin: 0;
            accent-color: #16a34a;
            cursor: pointer;
        }
        .answer.selected-answer .correct-toggle {
            color: #15803d;
            font-weight: 600;
        }

        .editor-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .editor-actions button { width: 100%; }
        #saveButton {
            background: #16a34a;
            color: #fff;
        }
        #saveButton:hover { background: #15803d; }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            text-align: center;
        }
        .code {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 12px 0;
            word-break: break-all;
        }

        @media (min-width: 560px) {
            .editor-actions {
                flex-direction: row;
            }
            .editor-actions button { width: auto; flex: 1; }
        }
    </style>


</head>


<body>

<button class="back" onclick="location.href='/teacher_page'">← В меню учителя</button>

<h1>Создание теста</h1>

<div class="form-card">
    <label for="topic">Тема</label>
    <input id="topic" type="text" placeholder="Например: Фотосинтез">

    <label for="count">Количество вопросов</label>
    <input id="count" type="number" value="5" min="1" max="20">

    <label for="timeMin">Время на тест</label>
    <div class="row" style="margin-bottom:12px">
      <input id="timeMin" type="number" min="0" value="0" placeholder="мин" style="flex:1">
      <span style="color:#6b7280">мин</span>
      <input id="timeSec" type="number" min="0" max="59" value="0" placeholder="сек" style="flex:1">
      <span style="color:#6b7280">сек</span>
    </div>

    <label for="description">Описание (для страницы входа)</label>
    <textarea id="description" placeholder="Необязательно: о чём тест, что взять с собой…"></textarea>

    <div class="form-actions">
        <button id="generateBtn" onclick="generateTest()">Сгенерировать</button>
    </div>
</div>

<div id="loadingBox" class="loading-box">
    <div class="spinner"></div>
    <p>Генерируем тест… Это может занять до минуты</p>
</div>

<div id="editor"></div>

<div class="editor-actions" id="editorActions" style="display:none">
    <button id="addQuestionButton" class="ghost" onclick="addQuestion()">+ Добавить вопрос</button>
    <button id="draftButton" class="ghost" onclick="saveTest(true, false)">💾 В черновики</button>
    <button id="saveButton" onclick="saveTest(false, false)">Опубликовать</button>
    <button id="saveNotifyButton" class="success" onclick="saveTest(false, true)">Опубликовать и уведомить</button>
</div>



<div id="testResult"></div>



<script>


let generatedTest = null;





async function generateTest(){
    const genBtn = document.getElementById("generateBtn");
    const loading = document.getElementById("loadingBox");
    if (genBtn) { genBtn.disabled = true; genBtn.textContent = "Генерация…"; }
    if (loading) loading.classList.add("show");
    document.getElementById("editor").innerHTML = "";
    const ea = document.getElementById("editorActions"); if (ea) ea.style.display = "none";




    const topic =
        document
        .getElementById("topic")
        .value;



    const count =
        Number(
            document
            .getElementById("count")
            .value
        );



    try {
        const response = await fetch("/generate-test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mode: "topic",
                topic: topic,
                question_count: count
            })
        });

        generatedTest = await response.json();

        if (!response.ok || generatedTest.error) {
            alert(generatedTest.error || generatedTest.detail || "Ошибка генерации");
            return;
        }
        if (generatedTest.questions) {
            generatedTest.questions.forEach(q => {
                if (q.explanation == null) q.explanation = "";
            });
        }
        renderEditor();
        document.getElementById("editorActions").style.display = "flex";
    } catch (e) {
        alert("Ошибка сети: " + (e.message || e));
    } finally {
        if (loading) loading.classList.remove("show");
        if (genBtn) { genBtn.disabled = false; genBtn.textContent = "Сгенерировать"; }
    }
}







function renderEditor(){


    const editor =
        document.getElementById("editor");


    editor.innerHTML = "";



    editor.innerHTML += `

        <h2>
        ${generatedTest.title}
        </h2>

    `;



    generatedTest.questions.forEach(
        (question,index)=>{


        let html = `
        <div class="question">
        <div class="q-head">
            <h3>Вопрос ${index + 1}</h3>
            <button class="delete" onclick="deleteQuestion(${index})">Удалить</button>
        </div>



        <label>Текст вопроса</label>
        <input
        value="${escAttr(question.text)}"
        onchange="updateQuestionText(${index}, this.value)"
        >

        <label>Объяснение (покажется ученику после ответа)</label>
        <textarea
        onchange="updateExplanation(${index}, this.value)"
        >${escText(question.explanation || "")}</textarea>

        <h4>Ответы:</h4>



        `;



        question.answers.forEach(
            (answer,answerIndex)=>{


            html += `
            <div class="answer ${answer.is_correct ? "selected-answer" : ""}">
                <label class="correct-toggle" title="Отметить правильным">
                    <input type="radio" name="correct_${index}"
                        ${answer.is_correct ? "checked" : ""}
                        onchange="updateCorrect(${index}, ${answerIndex})">
                    <span>✓</span>
                </label>
                <input type="text" value="${escAttr(answer.text)}"
                    onchange="updateAnswerText(${index}, ${answerIndex}, this.value)"
                    placeholder="Вариант ответа">
                <button class="delete" onclick="deleteAnswer(${index}, ${answerIndex})">✕</button>
            </div>
            `;


            }

        );



        html += `


        <button onclick="addAnswer(${index})">

        + Добавить ответ

        </button>



        </div>


        `;



        editor.innerHTML += html;


        }

    );


}









function escAttr(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
function escText(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
}

function updateExplanation(questionIndex, value) {
    generatedTest.questions[questionIndex].explanation = value;
}

function updateQuestionText(
    questionIndex,
    value
){


    generatedTest
    .questions[questionIndex]
    .text=value;


}







function updateAnswerText(
    questionIndex,
    answerIndex,
    value
){


    generatedTest
    .questions[questionIndex]
    .answers[answerIndex]
    .text=value;


}







function updateCorrect(
    questionIndex,
    answerIndex
){


    generatedTest
    .questions[questionIndex]
    .answers
    .forEach(
        answer=>{

            answer.is_correct=false;

        }
    );



    generatedTest
    .questions[questionIndex]
    .answers[answerIndex]
    .is_correct=true;



    renderEditor();


}







function addQuestion(){


    generatedTest.questions.push({

        text:"Новый вопрос",

        explanation:"",

        answers:[

            {
                text:"Вариант 1",
                is_correct:true
            },

            {
                text:"Вариант 2",
                is_correct:false
            }

        ]

    });



    renderEditor();


}







function deleteQuestion(index){


    generatedTest.questions.splice(
        index,
        1
    );


    renderEditor();


}







function addAnswer(questionIndex){


    generatedTest
    .questions[questionIndex]
    .answers.push({

        text:"Новый ответ",

        is_correct:false

    });



    renderEditor();


}







function deleteAnswer(
    questionIndex,
    answerIndex
){


    generatedTest
    .questions[questionIndex]
    .answers.splice(
        answerIndex,
        1
    );


    renderEditor();


}








async function saveTest(asDraft = false, notify = false) {
    const saveBtn = document.getElementById("saveButton");
    const draftBtn = document.getElementById("draftButton");
    const notifyBtn = document.getElementById("saveNotifyButton");
    [saveBtn, draftBtn, notifyBtn].forEach(b => { if (b) b.disabled = true; });
    if (saveBtn) saveBtn.textContent = asDraft ? "Сохраняем…" : "Публикуем…";

    const timeMin = Number(document.getElementById("timeMin")?.value || 0);
    const timeSec = Number(document.getElementById("timeSec")?.value || 0);
    const description = (document.getElementById("description")?.value || "").trim() || null;

    try {
        const response = await maxFetch("/tests/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title: generatedTest.title,
                description: description,
                time_limit_minutes: timeMin,
                time_limit_seconds: timeSec,
                is_draft: !!asDraft,
                notify: !!notify && !asDraft,
                questions: generatedTest.questions,
            }),
        });
        const result = await response.json();
        if (!response.ok) {
            alert(maxErrorText(response.status, result));
            return;
        }

        const timeInfo = result.time_limit_seconds
            ? `<p>⏱ Время: <b>${Math.floor(result.time_limit_seconds/60)} мин ${result.time_limit_seconds%60} сек</b></p>`
            : `<p>⏱ Без ограничения времени</p>`;
        const draftInfo = result.is_draft
            ? `<p>Черновик сохранён — откройте «Черновики», чтобы уведомить класс.</p>`
            : `<p>Тест опубликован</p>`;
        const notifyInfo = result.notify
            ? `<p>📢 Уведомления: ${result.notify.sent} из ${result.notify.total}</p>`
            : "";

        // После сохранения — карточка теста (QR, код, уведомление всегда доступны)
        if (result.test_id && !result.is_draft) {
            location.href = "/teacher_test?id=" + result.test_id;
            return;
        }

        document.getElementById("testResult").innerHTML = `
        <div class="result">
            <h2>💾 Запланирован</h2>
            ${draftInfo}
            <p>Код для учеников:</p>
            <div class="code">${result.code}</div>
            ${timeInfo}
            <p style="margin-top:12px">
              <a href="/teacher_test?id=${result.test_id}">Открыть карточку (QR)</a> ·
              <a href="/my_tests">Мои тесты</a>
            </p>
        </div>`;
    } catch (e) {
        alert("Ошибка: " + e.message);
    } finally {
        [saveBtn, draftBtn, notifyBtn].forEach(b => { if (b) b.disabled = false; });
        if (saveBtn) saveBtn.textContent = "Опубликовать";
    }
}



</script>


</body>

</html>

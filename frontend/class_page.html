<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой класс</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/static/max-auth.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 16px 40px;
            color: #222;
            background: #f9fafb;
        }

        h1 { font-size: 22px; margin: 0 0 4px; }
        .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 16px; }

        /* ─── Кнопка-переключатель «Редактировать» ─── */
        .edit-toggle {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            background: #fff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .edit-toggle:hover { background: #eff6ff; }
        .edit-toggle .arrow {
            transition: transform 0.2s;
            display: inline-block;
        }
        .edit-toggle.open .arrow { transform: rotate(180deg); }

        /* ─── Скрываемая панель редактирования ─── */
        .edit-panel {
            display: none;
            margin-bottom: 16px;
        }
        .edit-panel.open { display: block; }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card h2 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 140px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }
        button.btn {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
        }
        button.btn:hover { background: #1d4ed8; }

        /* ─── Список учеников ─── */
        .class-block {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .class-block h2 {
            font-size: 17px;
            margin: 0 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .class-block h2 .count {
            font-weight: 400;
            font-size: 14px;
            color: #6b7280;
        }

        ul.students {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.students li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            gap: 8px;
        }
        ul.students li:last-child { border-bottom: none; }

        .student-name { font-size: 15px; }
        .student-meta { color: #9ca3af; font-size: 13px; margin-left: 6px; }

        button.danger {
            background: #fee2e2;
            color: #b91c1c;
            padding: 6px 12px;
            font-size: 14px;
        }
        button.danger:hover { background: #fecaca; }

        .muted { color: #6b7280; font-size: 14px; }
        .empty { color: #9ca3af; font-style: italic; padding: 8px 0; font-size: 14px; }

        /* ─── Сообщения ─── */
        .msg {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
            font-size: 14px;
        }
        .msg.ok  { display: block; background: #dcfce7; color: #166534; }
        .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Мой класс</h1>
    <p class="subtitle">Ученики и классы, которые вы ведёте.</p>

    <div id="msg" class="msg"></div>

    <!-- Переключатель -->
    <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">
        <span>✏️ Редактировать класс</span>
        <span class="arrow">▾</span>
    </button>

    <!-- Скрываемая панель -->
    <div class="edit-panel" id="editPanel">
        <div class="card">
            <h2>Создать класс</h2>
            <div class="row">
                <input id="className" placeholder="Например, 10-А" />
                <button class="btn" onclick="createClass()">Создать</button>
            </div>
        </div>

        <div class="card">
            <h2>Добавить ученика по MAX ID</h2>
            <div class="row">
                <input id="maxId" type="number" placeholder="MAX ID ученика" />
                <select id="classSelect"></select>
                <button class="btn" onclick="addStudent()">Добавить</button>
            </div>
            <p class="muted" style="margin: 8px 0 0;">
                Ученик должен сначала написать боту команду <code>/id</code>.
            </p>
        </div>
    </div>

    <!-- Список классов с учениками -->
    <div id="classes"></div>

    <script>
        const API = "/api/class";

        const msgEl = document.getElementById("msg");

        function showMsg(text, ok = true) {
            msgEl.textContent = text;
            msgEl.className = "msg " + (ok ? "ok" : "err");
            setTimeout(() => { msgEl.className = "msg"; }, 4000);
        }

        function toggleEdit() {
            const btn = document.getElementById("editToggle");
            const panel = document.getElementById("editPanel");
            btn.classList.toggle("open");
            panel.classList.toggle("open");
        }

        async function api(path, opts = {}) {
            const res = await maxFetch(`${API}${path}`, {
                ...opts,
                headers: {
                    "Content-Type": "application/json",
                    ...(opts.headers || {}),
                },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const detail = typeof data.detail === "string"
                    ? data.detail
                    : (data.detail?.message || `Ошибка ${res.status}`);
                throw new Error(detail);
            }
            return data;
        }

        async function loadClasses() {
            const classes = await api("/classes");
            const container = document.getElementById("classes");
            const select = document.getElementById("classSelect");

            select.innerHTML = "";
            if (classes.length === 0) {
                const opt = document.createElement("option");
                opt.textContent = "— нет классов —";
                opt.value = "";
                select.appendChild(opt);
            } else {
                for (const c of classes) {
                    const opt = document.createElement("option");
                    opt.value = c.id;
                    opt.textContent = `${c.name} (${c.student_count})`;
                    select.appendChild(opt);
                }
            }

            container.innerHTML = "";
            if (classes.length === 0) {
                container.innerHTML = '<p class="empty">Пока нет ни одного класса. Нажмите «Редактировать класс», чтобы создать.</p>';
                return;
            }

            for (const c of classes) {
                const students = await api(`/classes/${c.id}/students`);
                const block = document.createElement("div");
                block.className = "class-block";
                block.innerHTML = `
                    <h2>
                        <span>${escapeHtml(c.name)}</span>
                        <span class="count">${students.length} чел.</span>
                    </h2>
                    <ul class="students">
                        ${students.length === 0
                            ? '<li class="empty">Нет учеников</li>'
                            : students.map(s => `
                                <li>
                                    <span>
                                        <span class="student-name">${escapeHtml(s.username)}</span>
                                        <span class="student-meta">max_id: ${s.max_id}</span>
                                    </span>
                                    <button class="danger" onclick="removeStudent(${c.id}, ${s.id})">Удалить</button>
                                </li>
                            `).join("")
                        }
                    </ul>
                `;
                container.appendChild(block);
            }
        }

        async function createClass() {
            const input = document.getElementById("className");
            const name = input.value.trim();
            if (!name) return;
            try {
                await api("/classes", {
                    method: "POST",
                    body: JSON.stringify({ name }),
                });
                input.value = "";
                showMsg("Класс создан");
                loadClasses();
            } catch (e) { showMsg(e.message, false); }
        }

        async function addStudent() {
            const maxIdInput = document.getElementById("maxId");
            const classSelect = document.getElementById("classSelect");
            const max_id = parseInt(maxIdInput.value, 10);
            const class_id = parseInt(classSelect.value, 10);

            if (!max_id) return showMsg("Введите MAX ID", false);
            if (!class_id) return showMsg("Сначала создайте класс", false);

            try {
                await api("/students", {
                    method: "POST",
                    body: JSON.stringify({ max_id, class_id }),
                });
                maxIdInput.value = "";
                showMsg("Ученик добавлен");
                loadClasses();
            } catch (e) { showMsg(e.message, false); }
        }

        async function removeStudent(classId, studentId) {
            if (!confirm("Удалить ученика из класса?")) return;
            try {
                await api(`/classes/${classId}/students/${studentId}`, { method: "DELETE" });
                showMsg("Ученик удалён");
                loadClasses();
            } catch (e) { showMsg(e.message, false); }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
                "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
            }[ch]));
        }

        loadClasses();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой класс</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/static/max-auth.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 16px 40px;
            color: #222;
            background: #f9fafb;
        }

        h1 { font-size: 22px; margin: 0 0 4px; }
        .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 16px; }

        /* ─── Кнопка-переключатель «Редактировать» ─── */
        .edit-toggle {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            background: #fff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .edit-toggle:hover { background: #eff6ff; }
        .edit-toggle .arrow {
            transition: transform 0.2s;
            display: inline-block;
        }
        .edit-toggle.open .arrow { transform: rotate(180deg); }

        /* ─── Скрываемая панель редактирования ─── */
        .edit-panel {
            display: none;
            margin-bottom: 16px;
        }
        .edit-panel.open { display: block; }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card h2 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 140px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }
        button.btn {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
        }
        button.btn:hover { background: #1d4ed8; }
        button.btn.danger { background: #dc2626; }
        button.btn.danger:hover { background: #b91c1c; }

        /* ─── Список учеников ─── */
        .class-block {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .class-block h2 {
            font-size: 17px;
            margin: 0 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .class-block h2 .count {
            font-weight: 400;
            font-size: 14px;
            color: #6b7280;
        }

        ul.students {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.students li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            gap: 8px;
        }
        ul.students li:last-child { border-bottom: none; }

        .student-name { font-size: 15px; }
        .student-meta { color: #9ca3af; font-size: 13px; margin-left: 6px; }

        button.danger {
            background: #fee2e2;
            color: #b91c1c;
            padding: 6px 12px;
            font-size: 14px;
        }
        button.danger:hover { background: #fecaca; }

        .muted { color: #6b7280; font-size: 14px; }
        .empty { color: #9ca3af; font-style: italic; padding: 8px 0; font-size: 14px; }

        /* ─── Сообщения ─── */
        .msg {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
            font-size: 14px;
        }
        .msg.ok  { display: block; background: #dcfce7; color: #166534; }
        .msg.err { display: block; background: #fee2e2; color: #991b1b; }

        /* ─── Таблица оценок ─── */
        .grades-wrap { overflow-x: auto; margin-top: 10px; }
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 400px;
        }
        .grades-table th, .grades-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f3f4f6;
            text-align: center;
            white-space: nowrap;
        }
        .grades-table th {
            background: #f3f4f6;
            font-weight: 600;
        }
        .grades-table th.test-head {
            cursor: pointer;
            color: #2563eb;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .grades-table th.test-head:hover { text-decoration: underline; }
        .grades-table td.name-col {
            text-align: left;
            font-weight: 500;
            position: sticky;
            left: 0;
            background: #fff;
        }
        .grades-table .score-ok { color: #16a34a; font-weight: 700; }
        .grades-table .score-mid { color: #d97706; font-weight: 700; }
        .grades-table .score-bad { color: #dc2626; font-weight: 700; }
        .grades-table .score-none { color: #9ca3af; }
        .grades-section { margin-top: 20px; }
        .grades-section h2 { font-size: 17px; margin: 0 0 10px; }
    </style>
</head>
<body>
    <button class="back" onclick="location.href='/teacher_page'">← В меню учителя</button>
    <h1>Мой класс</h1>
    <p class="subtitle">Ученики и классы, которые вы ведёте.</p>

    <div id="msg" class="msg"></div>

    <!-- Переключатель -->
    <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">
        <span>✏️ Редактировать класс</span>
        <span class="arrow">▾</span>
    </button>

    <!-- Скрываемая панель -->
    <div class="edit-panel" id="editPanel">
        <div class="card">
            <h2>Создать класс</h2>
            <div class="row">
                <input id="className" placeholder="Например, 10-А" />
                <button class="btn" onclick="createClass()">Создать</button>
            </div>
        </div>

        <div class="card">
            <h2>Добавить ученика по MAX ID</h2>
            <div class="row">
                <input id="maxId" type="number" placeholder="MAX ID ученика" />
                <select id="classSelectAdd"></select>
                <button class="btn" onclick="addStudent()">Добавить</button>
            </div>
            <p class="muted" style="margin: 8px 0 0;">
                Ученик должен сначала написать боту команду <code>/id</code>.
            </p>
        </div>

        <div class="card">
            <h2>Удалить ученика по MAX ID</h2>
            <div class="row">
                <input id="removeMaxId" type="number" placeholder="MAX ID для удаления" />
                <select id="classSelectRemove"></select>
                <button class="btn danger"  style="color:white" onclick="removeStudentByMaxId()">Удалить</button>
            </div>
            <p class="muted" style="margin: 8px 0 0;">
                Чтобы не удалить по ошибке — нужно явно ввести MAX ID ученика.
            </p>
        </div>
    </div>

    <!-- Единая таблица: ученики и оценки -->
    <div class="grades-section" id="gradesSection">
        <h2>Оценки за тесты</h2>
        <div id="grades"><p class="muted">Загрузка...</p></div>
    </div>

    <script>
        const API = "/api/class";
        let editMode = false;

        const msgEl = document.getElementById("msg");

        function showMsg(text, ok = true) {
            msgEl.textContent = text;
            msgEl.className = "msg " + (ok ? "ok" : "err");
            setTimeout(() => { msgEl.className = "msg"; }, 4000);
        }

        function toggleEdit() {
            const btn = document.getElementById("editToggle");
            const panel = document.getElementById("editPanel");
            btn.classList.toggle("open");
            panel.classList.toggle("open");
            editMode = panel.classList.contains("open");
        }

        async function api(path, opts = {}) {
            const res = await maxFetch(`${API}${path}`, {
                ...opts,
                headers: {
                    "Content-Type": "application/json",
                    ...(opts.headers || {}),
                },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const detail = typeof data.detail === "string"
                    ? data.detail
                    : (data.detail?.message || `Ошибка ${res.status}`);
                throw new Error(detail);
            }
            return data;
        }

        function fillClassSelects(classes) {
            for (const selId of ["classSelectAdd", "classSelectRemove"]) {
                const select = document.getElementById(selId);
                if (!select) continue;
                select.innerHTML = "";
                if (!classes.length) {
                    const opt = document.createElement("option");
                    opt.textContent = "— нет классов —";
                    opt.value = "";
                    select.appendChild(opt);
                } else {
                    for (const c of classes) {
                        const opt = document.createElement("option");
                        opt.value = c.id;
                        opt.textContent = `${c.name} (${c.student_count})`;
                        select.appendChild(opt);
                    }
                }
            }
        }

        async function loadClasses() {
            const classes = await api("/classes");
            fillClassSelects(classes);
        }

        async function createClass() {
            const input = document.getElementById("className");
            const name = input.value.trim();
            if (!name) return;
            try {
                await api("/classes", {
                    method: "POST",
                    body: JSON.stringify({ name }),
                });
                input.value = "";
                showMsg("Класс создан");
                await loadClasses();
                await loadGrades();
            } catch (e) { showMsg(e.message, false); }
        }

        async function addStudent() {
            const maxIdInput = document.getElementById("maxId");
            const classSelect = document.getElementById("classSelectAdd");
            const max_id = parseInt(maxIdInput.value, 10);
            const class_id = parseInt(classSelect.value, 10);

            if (!max_id) return showMsg("Введите MAX ID", false);
            if (!class_id) return showMsg("Сначала создайте класс", false);

            try {
                await api("/students", {
                    method: "POST",
                    body: JSON.stringify({ max_id, class_id }),
                });
                maxIdInput.value = "";
                showMsg("Ученик добавлен");
                await loadClasses();
                await loadGrades();
            } catch (e) { showMsg(e.message, false); }
        }

        async function removeStudentByMaxId() {
            const maxIdInput = document.getElementById("removeMaxId");
            const classSelect = document.getElementById("classSelectRemove");
            const max_id = parseInt(maxIdInput.value, 10);
            const class_id = parseInt(classSelect.value, 10);

            if (!max_id) return showMsg("Введите MAX ID ученика", false);
            if (!class_id) return showMsg("Выберите класс", false);

            try {
                const students = await api(`/classes/${class_id}/students`);
                const student = students.find(s => Number(s.max_id) === max_id);
                if (!student) {
                    return showMsg("Ученик с таким MAX ID не найден в выбранном классе", false);
                }
                if (!confirm(`Удалить ученика max_id ${max_id} (${student.username}) из класса?`)) return;

                await api(`/classes/${class_id}/students/${student.id}`, { method: "DELETE" });
                maxIdInput.value = "";
                showMsg("Ученик удалён");
                await loadClasses();
                await loadGrades();
            } catch (e) { showMsg(e.message, false); }
        }

        function shortName(name) {
            const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return "—";
            if (parts.length >= 2) {
                const first = parts[0];
                const last = parts[parts.length - 1];
                return last.charAt(0).toUpperCase() + last.slice(1) + " " + first.charAt(0).toUpperCase() + ".";
            }
            const w = parts[0];
            return w.charAt(0).toUpperCase() + w.slice(1);
        }

        function scoreClass(pct) {
            if (pct == null) return "score-none";
            if (pct >= 70) return "score-ok";
            if (pct >= 40) return "score-mid";
            return "score-bad";
        }

        async function loadGrades() {
            const box = document.getElementById("grades");
            try {
                const res = await maxFetch("/api/teacher/gradebook");
                if (!res.ok) {
                    const d = await res.json().catch(() => ({}));
                    const detail = typeof d.detail === "string" ? d.detail
                        : (Array.isArray(d.detail) ? d.detail.map(x => x.msg || JSON.stringify(x)).join("; ") : null);
                    throw new Error(detail || ("Ошибка " + res.status));
                }
                const data = await res.json();
                if (!data.students || !data.students.length) {
                    box.innerHTML = '<p class="empty">Нет учеников в классах. Добавьте учеников в «Редактировать класс».</p>';
                    return;
                }
                if (!data.tests || !data.tests.length) {
                    // ученики есть, тестов нет — покажем хотя бы список ФИО
                    box.innerHTML = `<div class="grades-wrap"><table class="grades-table">
                        <thead><tr><th class="name-col">ФИО</th><th>MAX ID</th></tr></thead>
                        <tbody>
                        ${data.students.map(st => `
                            <tr>
                                <td class="name-col">${escapeHtml(st.username)}</td>
                                <td class="score-none">${st.max_id ?? "—"}</td>
                            </tr>
                        `).join("")}
                        </tbody></table></div>
                        <p class="muted" style="margin-top:8px">Тестов пока нет — оценки появятся после публикаций.</p>`;
                    return;
                }

                const head = data.tests.map(t =>
                    `<th class="test-head" title="${escapeHtml(t.title)}"
                        onclick="location.href='/journal_page#test=${t.test_id}'">
                        ${escapeHtml(t.title.length > 16 ? t.title.slice(0, 14) + "…" : t.title)}
                        ${t.created_at ? `<div style="font-weight:400;color:#6b7280;font-size:11px">${escapeHtml(t.created_at)}</div>` : ""}
                    </th>`
                ).join("");

                const rows = data.students.map(st => {
                    const cells = st.scores.map(sc => {
                        if (sc.score == null) {
                            return `<td class="score-none">—</td>`;
                        }
                        const pct = sc.percent != null ? Math.round(sc.percent) : null;
                        return `<td class="${scoreClass(sc.percent)}">${sc.score}/${sc.total}${pct != null ? ` <small>(${pct}%)</small>` : ""}</td>`;
                    }).join("");
                    return `<tr>
                        <td class="name-col">
                            ${escapeHtml(st.username)}
                            <div style="font-weight:400;color:#9ca3af;font-size:11px">${st.max_id ?? ""}</div>
                        </td>
                        ${cells}
                    </tr>`;
                }).join("");

                box.innerHTML = `<div class="grades-wrap"><table class="grades-table">
                    <thead><tr><th class="name-col">ФИО</th>${head}</tr></thead>
                    <tbody>${rows}</tbody>
                </table></div>
                <p class="muted" style="margin-top:8px">Нажмите на название теста, чтобы открыть аналитику. Дата под названием — день.месяц создания.</p>`;
            } catch (e) {
                box.innerHTML = `<p class="empty" style="color:#dc2626">${escapeHtml(e.message)}</p>`;
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
                "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
            }[ch]));
        }

        loadClasses();
        loadGrades();
    </script>
</body>
</html>

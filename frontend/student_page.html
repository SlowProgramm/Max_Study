<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="/static/max-auth.js"></script>
<link rel="stylesheet" href="/static/style.css">
<title>Ученик — Синапс</title>
<style>
  .menu-group {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .menu-group .label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px 4px;
  }
  .menu-group.tests {
    border-color: #86efac;
    background: #f0fdf4;
  }
  .menu-group.tests .label { color: #166534; }
  .menu-group.tests button {
    background: #16a34a;
    margin-bottom: 6px;
  }
  .menu-group.tests button:last-child { margin-bottom: 0; }
  .menu-group.tests button:hover { background: #15803d; }
  .menu-group.other button {
    background: #4b5563;
    margin-bottom: 6px;
  }
  .menu-group.other button:last-child { margin-bottom: 0; }
  .menu-group.other button:hover { background: #374151; }
  .menu-stack { gap: 0; }
</style>
</head>
<body>
<div class="center-page">
  <h1>Меню ученика</h1>
  <p class="subtitle">Синапс — тесты и подготовка</p>
  <div class="menu-stack">
    <div class="menu-group tests">
      <div class="label">Тесты</div>
      <button class="student" onclick="location.href='/student.html'">Найти тест по коду</button>
      <button class="student" onclick="location.href='/student_scheduled'">Запланированные</button>
      <button class="student" onclick="location.href='/history_page'">Мои результаты</button>
    </div>
    <div class="menu-group other">
      <div class="label">Подготовка</div>
      <button onclick="location.href='/smart_notes.html'">Умный конспект</button>
    </div>
    <button class="ghost" onclick="location.href='/'">← На главную</button>
  </div>
  <div id="regGate" style="display:none">
    <p class="subtitle" style="margin-bottom:16px">Чтобы пользоваться разделом ученика, пройдите регистрацию в боте: кнопка «Регистрация» → укажите Фамилию и Имя.</p>
    <button class="ghost" onclick="location.href='/'">← На главную</button>
  </div>
</div>
<script>
(async function checkStudentReg() {
  var stack = document.querySelector(".menu-stack");
  var gate = document.getElementById("regGate");
  try {
    var res = await maxFetch("/auth/me");
    if (!res.ok) {
      if (stack) stack.style.display = "none";
      if (gate) gate.style.display = "block";
      return;
    }
    var u = await res.json();
    var registered = !!(u.full_name && String(u.full_name).trim());
    if (!registered) {
      if (stack) stack.style.display = "none";
      if (gate) gate.style.display = "block";
    }
  } catch (e) {
    if (stack) stack.style.display = "none";
    if (gate) gate.style.display = "block";
  }
})();
</script>
</body>
</html>
